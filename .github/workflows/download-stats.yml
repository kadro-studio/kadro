# Every hour records how many times each release file has been downloaded. GitHub keeps only the
# running total, so these snapshots are what kadro.studio/stats/ turns into downloads per day and the
# hour they happened in. A snapshot is saved only when a count changed. The history lives on the
# `stats` branch, away from the code (the branch is created on the first run).
name: Download stats

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  # To find when the previous run read the counts.
  actions: read

concurrency:
  group: download-stats

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: code
      - name: Check out the history
        env:
          TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" stats > /dev/null; then
            git clone --quiet --depth 1 --branch stats "$url" data
          else
            git init --quiet -b stats data
            git -C data remote add origin "$url"
          fi
      - name: Record the counts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATS_WORKFLOW: download-stats.yml
        run: node code/scripts/download-stats.mjs data/downloads.json "$GITHUB_REPOSITORY"
      - name: Save
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads.json
          git diff --cached --quiet && exit 0
          git commit --quiet -m "Download counts $(date -u '+%F %H:%M')"
          git push --quiet origin stats
